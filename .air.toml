root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  entrypoint = ["./tmp/main"]
  cmd = "go build -o ./tmp/main ."
  delay = 1000
  # static/ and index.html are read from disk on every request, so they don't need a rebuild
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "certs", "static", "tests", "scripts", "secrets", "gouda-woulda", "backups"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  # empty = watch every directory not excluded above (main.go, db, models, internal, ...)
  include_dir = []
  # sql: migrations are embedded into the binary, so a new migration needs a rebuild
  include_ext = ["go", "sql"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  # file change events from the Windows /mnt/c folder don't reach the container, so poll instead
  poll = true
  poll_interval = 1000
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
