<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookbook</title>

    <link rel="stylesheet" href="/static/css/styles.css?v=<?= time() ?>">
</head>
<body>
    <div id="toast"></div>
    <div class="container dev">
        <h1>API Testing area</h1>
		<div style="display:flex; width:100%; justify-content:space-between; margin-top:8px;">
		<button onclick="toggleDarkMode()">Toggle Dark Mode</button>
		<button onclick="openModal('tagIngredientsModal')">Tag Ingredients</button>
		<button onclick="loginWithGoogle()">Continue with Google</button>
	</div>
	<br/>
	<label class='test'> Dinner </label>
        <p>Click the button to make a request to <code>/hello</code></p>
        <button id="requestBtn" onclick="makeRequest()">Send Request</button>
        <div id="response"></div>
    </div>

    <div class="container">
	<div class="recipe-header">
		<button id="addRecipeBtn" onclick="openModal('recipeModal')">Add Recipe</button>
	    <button id="makeGroceryListBtn" onclick="setMakingGroceryList()">Make Grocery List</button>
	    <div></br></div>
	    <button id="submitGroceryListBtn" onclick="submitGroceryList()">Submit Grocery List</button>
	</div>
	<div class="dev">
        <p>Click the button to fetch recipes from <code>/recipes</code></p>
        <button id="recipesBtn" onclick="fetchRecipes()">Get Recipes</button>
	</div>
    <div id="recipesResponse"></div>

	<!-- Recipe Add Modal -->
	<div id="recipeModal" class="modal" onclick="handleModalBackgroundClick(event, this)">
	  <div class="modal-content">
	    <span class="close" onclick="closeModal(this.closest('.modal'))">&times;</span>
	    <h2>Add New Recipe</h2>
	    <form id="recipeForm" onsubmit="submitRecipeForm(event)">
	      <label for="recipeName">Name:</label>
	      <input type="text" id="recipeName" name="name" required />
	
	      <label for="recipeDescription">Description:</label>
	      <textarea rows=10 id="recipeDescription" name="description" required></textarea>
	
	      <button type="submit">Save Recipe</button>
	    </form>
	  </div>
	</div>
    </div>
    <div class="modal" id="groceryListModal" onclick="handleModalBackgroundClick(event, this)">
	<div class="modal-content">
	    <span class="close" onclick="closeModal(this.closest('.modal'))">&times;</span>
	    <button id="groceryListCopyBtn">Copy</button>
	    <textarea rows=30 cols=10 id="groceryListText"></textarea>
	</div>
    </div>

    <!-- External JS file -->
	<script src="/static/js/main.js?v=<?= time() ?>"></script>
</body>
</html>
